spring:
  application:
    name: credit-card-validation-service
  profiles:
    default: local
server:
  port: 9090
logging:
  file:
    name: logs/${spring.application.name}.log
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.velocitymotors.creditcard: DEBUG
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/${spring.application.name}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:creditcarddb
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true