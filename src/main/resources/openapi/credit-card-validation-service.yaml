openapi: 3.0.3
info:
  title: Credit Card Payment API
  description: API to retrieve the status of a credit card payment
  version: 1.0.0
servers:
  - url: http://localhost:9090/host/credit-card-payment-api
paths:
  /payment-status:
    post:
      operationId: retrievePaymentStatus
      tags:
        - CreditCardPayment
      summary: Retrieve payment status
      description: Accepts a payment reference and provides the payment status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStatusRetrievalRequest'
      responses:
        '200':
          description: Successful response with payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStatusResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Payment not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Internal server error
components:
  schemas:
    PaymentStatusRetrievalRequest:
      type: object
      required:
        - paymentReference
      properties:
        paymentReference:
          type: string
          description: Reference of the payment
          example: CC123456789
    PaymentStatusResponse:
      type: object
      properties:
        lastUpdateDate:
          type: string
          format: date-time
          description: Last update time
          example: '2017-07-21T17:32:28Z'
        status:
          type: string
          enum:
            - APPROVED
            - REJECTED
          example: APPROVED
          description: Payment status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
